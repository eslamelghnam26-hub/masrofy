name: masrofy
description: "مصروفي - تطبيق إدارة المصاريف الشخصية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  file_picker: ^13.4.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon_launcher.png"
  adaptive_icon_background: "#027A3B"
  adaptive_icon_foreground: "assets/icon/app_icon_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - google_fonts/
